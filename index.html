<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Registro CTO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { 
            --bg-main: #0B0F19; 
            --bg-card: #151A27; 
            --border-color: #2A3441; 
            --text-main: #E2E8F0; 
            --text-muted: #94A3B8; 
            --accent: #3B82F6; 
            --success: #10B981;
            --purple: #8B5CF6;
            --orange: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); }
        
        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .header-title h1 { font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .header-title p { color: var(--text-muted); margin-top: 4px; }
        
        .btn-sync { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .btn-sync:hover { background: #2563EB; }
        
        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 16px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; }
        .stat-icon.blue { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .stat-icon.green { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .stat-icon.purple { background: rgba(139, 92, 246, 0.1); color: var(--purple); }
        .stat-icon.orange { background: rgba(245, 158, 11, 0.1); color: var(--orange); }
        .stat-info h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-info p { font-size: 1.5rem; font-weight: 700; color: white; }

        /* Charts */
        .charts-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 32px; }
        .charts-container h2 { font-size: 1.2rem; margin-bottom: 20px; color: white; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }

        /* Table */
        .table-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; margin-bottom: 32px; }
        .table-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .table-header h2 { font-size: 1.2rem; color: white; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px 20px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-color); background: #111520; }
        td { padding: 16px 20px; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .foto-link { color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .foto-link:hover { text-decoration: underline; }
        
        /* Loading Overlay */
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; font-size: 1.5rem; color: var(--accent); backdrop-filter: blur(4px); }
        #loading span { margin-top: 12px; font-size: 1rem; color: white; font-weight: 500; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span>Buscando métricas oficiais...</span>
    </div>

    <div class="dashboard-container">
        <header>
            <div class="header-title">
                <h1><i class="fa-solid fa-chart-line" style="color: var(--accent)"></i> Dashboard CTO</h1>
                <p>Produtividade da Equipe de Campo</p>
            </div>
            <button class="btn-sync" onclick="carregarDados()">
                <i class="fa-solid fa-rotate"></i> Atualizar Dados
            </button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fa-solid fa-calendar-day"></i></div>
                <div class="stat-info">
                    <h3>Registros Hoje</h3>
                    <p id="stat-hoje">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-calendar-week"></i></div>
                <div class="stat-info">
                    <h3>Registros na Semana</h3>
                    <p id="stat-semana">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fa-solid fa-calendar-days"></i></div>
                <div class="stat-info">
                    <h3>Registros no Mês</h3>
                    <p id="stat-mes">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fa-solid fa-trophy"></i></div>
                <div class="stat-info">
                    <h3>Top Colaborador (Mês)</h3>
                    <p id="stat-top" style="font-size: 1rem; margin-top: 5px;">-</p>
                </div>
            </div>
        </div>

        <div class="charts-container">
            <h2>Ranking Anual de Produtividade (Por Colaborador)</h2>
            <canvas id="rankingChart" height="100"></canvas>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Últimos Registros em Campo</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Data e Hora</th>
                        <th>Colaborador</th>
                        <th>MAC</th>
                        <th>CTO</th>
                        <th>Prova (Foto)</th>
                    </tr>
                </thead>
                <tbody id="tabela-logs">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // COLE AQUI A NOVA URL DO APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhP1fH7hWEiC_wfbM8iuYuBhEVYo5fDh6n0KPJoUThHPgGQqR6QDy6xKRAt944sxGg/exec";
        
        let rankingChartInstance = null;

        document.addEventListener('DOMContentLoaded', carregarDados);

        async function carregarDados() {
            document.getElementById('loading').classList.remove('hidden');
            
            try {
                // Chama a rota ?action=get_dashboard que programamos no backend
                const res = await fetch(`${SCRIPT_URL}?action=get_dashboard`);
                const json = await res.json();
                
                if (json.status === "success") {
                    processarMetricas(json.data);
                    renderizarTabela(json.data);
                } else {
                    alert("Erro ao buscar dados: " + json.message);
                }
            } catch (err) {
                alert("Erro de conexão ao carregar o dashboard.");
                console.error(err);
            }
            
            document.getElementById('loading').classList.add('hidden');
        }

        function processarMetricas(logs) {
            const hoje = new Date();
            let countHoje = 0, countSemana = 0, countMes = 0;
            
            const contagemColabMes = {};
            const contagemColabAno = {}; // Para o gráfico

            logs.forEach(log => {
                // Espera-se data no formato "dd/mm/yyyy hh:mm:ss" ou JS date
                // Adaptação simples para parse de data brasileira
                let dataLog = null;
                if (log.dataHora.includes('/')) {
                    const partes = log.dataHora.split(' ')[0].split('/');
                    dataLog = new Date(partes[2], partes[1] - 1, partes[0]);
                } else {
                    dataLog = new Date(log.dataHora); // Fallback
                }
                
                if (isNaN(dataLog.getTime())) return;

                // Diferenças
                const diffTime = Math.abs(hoje - dataLog);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

                if (diffDays <= 1 && dataLog.getDate() === hoje.getDate()) countHoje++;
                if (diffDays <= 7) countSemana++;
                if (dataLog.getMonth() === hoje.getMonth() && dataLog.getFullYear() === hoje.getFullYear()) {
                    countMes++;
                    contagemColabMes[log.colaborador] = (contagemColabMes[log.colaborador] || 0) + 1;
                }
                
                if (dataLog.getFullYear() === hoje.getFullYear()) {
                    contagemColabAno[log.colaborador] = (contagemColabAno[log.colaborador] || 0) + 1;
                }
            });

            document.getElementById('stat-hoje').innerText = countHoje;
            document.getElementById('stat-semana').innerText = countSemana;
            document.getElementById('stat-mes').innerText = countMes;

            // Encontrar Top Colaborador do Mês
            let topName = "Nenhum", maxScore = 0;
            for (const [name, score] of Object.entries(contagemColabMes)) {
                if (score > maxScore) { maxScore = score; topName = name; }
            }
            document.getElementById('stat-top').innerText = `${topName} (${maxScore})`;

            // Renderizar Gráfico Anual
            renderizarGrafico(contagemColabAno);
        }

        function renderizarGrafico(dadosAno) {
            const ctx = document.getElementById('rankingChart').getContext('2d');
            
            const labels = Object.keys(dadosAno);
            const data = Object.values(dadosAno);

            if (rankingChartInstance) {
                rankingChartInstance.destroy();
            }

            rankingChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total de Registros (Ano)',
                        data: data,
                        backgroundColor: 'rgba(59, 130, 246, 0.8)',
                        borderColor: '#3B82F6',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94A3B8' } },
                        x: { grid: { display: false }, ticks: { color: '#94A3B8' } }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function renderizarTabela(logs) {
            const tbody = document.getElementById('tabela-logs');
            tbody.innerHTML = '';
            
            // Inverter para mostrar os mais recentes primeiro
            const ultimos = [...logs].reverse().slice(0, 50); // Mostrar os últimos 50
            
            if(ultimos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Nenhum registro encontrado na planilha Admin.</td></tr>';
                return;
            }

            ultimos.forEach(log => {
                const tr = document.createElement('tr');
                
                let linkFoto = '<span style="color:#64748B">Sem foto</span>';
                if (log.foto && log.foto.startsWith('http')) {
                    linkFoto = `<a href="${log.foto}" target="_blank" class="foto-link"><i class="fa-regular fa-image"></i> Ver Foto</a>`;
                }

                tr.innerHTML = `
                    <td>${log.dataHora}</td>
                    <td style="font-weight: 500; color: white;">${log.colaborador}</td>
                    <td><span style="background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; font-family: monospace;">${log.mac}</span></td>
                    <td>${log.cto}</td>
                    <td>${linkFoto}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
